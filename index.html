<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Semana - UFCSPA Agenda</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container py-4 main-container">
      <!-- Cabeçalho -->
      <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="fw-bold m-0">Minha Semana</h1>
          <p class="text-muted small m-0">Gestão de Compromissos e Grade Académica UFCSPA</p>
        </div>
        <button
          class="btn btn-add-appointment p-0"
          data-bs-toggle="modal"
          data-bs-target="#appointmentModal"
          id="btnOpenAddModal"
        >
          <i class="bi bi-plus-circle-fill display-5 text-success"></i>
        </button>
      </header>

      <!-- Grid Principal da Semana -->
      <main class="row g-4" id="mainGridContainer">
        <!-- Calendário, Dia Corrente, Disciplinas Semestrais e demais dias renderizados via JS -->
      </main>
    </div>

    <!-- Modal Cadastrar / Editar Compromisso com Abas -->
    <div class="modal fade" id="appointmentModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold" id="modalTitle">Novo Compromisso</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <!-- Navegação por Abas -->
          <div class="px-3 pt-2 border-bottom">
            <ul class="nav nav-tabs card-header-tabs" id="appointmentTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active fw-semibold"
                  id="general-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#general-pane"
                  type="button"
                  role="tab"
                  onclick="setFormType('general')"
                >
                  <i class="bi bi-calendar-event me-1"></i> Geral / Evento Único
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link fw-semibold"
                  id="academic-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#academic-pane"
                  type="button"
                  role="tab"
                  onclick="setFormType('academic')"
                >
                  <i class="bi bi-mortarboard-fill me-1"></i> Disciplina Semestral (UFCSPA)
                </button>
              </li>
            </ul>
          </div>

          <form id="appointmentForm">
            <div class="modal-body pt-3">
              <input type="hidden" id="appointmentId" />
              <input type="hidden" id="formType" value="general" />

              <!-- Título do Compromisso / Disciplina -->
              <div class="mb-3">
                <label for="title" class="form-label fw-bold" id="labelTitle">Título do Compromisso</label>
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  required
                  placeholder="Ex: Palestra / Reunião / Prova de Anatomia"
                />
              </div>

              <!-- Conteúdo das Abas -->
              <div class="tab-content" id="appointmentTabContent">
                
                <!-- ABA 1: GERAL / EVENTO ÚNICO -->
                <div class="tab-pane fade show active" id="general-pane" role="tabpanel">
                  <div class="row">
                    <div class="col-md-4 mb-3">
                      <label for="date" class="form-label fw-bold">Data do Evento</label>
                      <input type="date" class="form-control" id="date" required />
                    </div>
                    <div class="col-md-4 mb-3">
                      <label for="time" class="form-label fw-bold">Horário de Início</label>
                      <input type="time" class="form-control" id="time" required />
                    </div>
                    <div class="col-md-4 mb-3">
                      <label for="endTime" class="form-label fw-bold">Horário de Fim</label>
                      <input type="time" class="form-control" id="endTime" />
                    </div>
                  </div>

                  <!-- Categoria do Evento Único -->
                  <div class="p-3 bg-light rounded border mb-3">
                    <label class="form-label fw-bold d-block mb-2">Categoria do Evento</label>
                    <div class="d-flex flex-wrap gap-3">
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="isExam" />
                        <label class="form-check-label fw-semibold text-danger" for="isExam">
                          <i class="bi bi-exclamation-triangle-fill me-1"></i> Dia de Prova / Exame
                        </label>
                      </div>
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="isCanceled" />
                        <label class="form-check-label fw-semibold text-secondary" for="isCanceled">
                          <i class="bi bi-x-circle-fill me-1"></i> Compromisso Cancelado
                        </label>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- ABA 2: DISCIPLINA SEMESTRAL -->
                <div class="tab-pane fade" id="academic-pane" role="tabpanel">
                  <div class="row">
                    <div class="col-md-4 mb-3">
                      <label for="subjectCode" class="form-label fw-bold">Código da Disciplina</label>
                      <input type="text" class="form-control" id="subjectCode" placeholder="Ex: BIO0102" />
                    </div>
                    <div class="col-md-5 mb-3">
                      <label for="professor" class="form-label fw-bold">Professor Regente</label>
                      <input type="text" class="form-control" id="professor" placeholder="Ex: Dr. Carlos Silva" />
                    </div>
                    <div class="col-md-3 mb-3">
                      <label for="creditPeriods" class="form-label fw-bold">Períodos / Créditos</label>
                      <input type="number" class="form-control" id="creditPeriods" min="1" max="10" placeholder="Ex: 4" />
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-4 mb-3">
                      <label for="academicStartDate" class="form-label fw-bold">Data da 1ª Aula</label>
                      <input type="date" class="form-control" id="academicStartDate" />
                    </div>
                    <div class="col-md-4 mb-3">
                      <label for="academicStartTime" class="form-label fw-bold">Horário de Início</label>
                      <input type="time" class="form-control" id="academicStartTime" />
                    </div>
                    <div class="col-md-4 mb-3">
                      <label for="academicEndTime" class="form-label fw-bold">Horário de Fim</label>
                      <input type="time" class="form-control" id="academicEndTime" />
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="semester" class="form-label fw-bold">Semestre Letivo</label>
                      <select class="form-select" id="semester">
                        <option value="2026/1">2026/1</option>
                        <option value="2026/2" selected>2026/2</option>
                        <option value="2027/1">2027/1</option>
                        <option value="2027/2">2027/2</option>
                      </select>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="repeatWeeks" class="form-label fw-bold">Duração em Semanas</label>
                      <input type="number" class="form-control" id="repeatWeeks" min="1" max="52" value="16" />
                      <small class="text-muted">Aulas serão geradas semanalmente para este período.</small>
                    </div>
                  </div>
                </div>

              </div>

              <!-- Campos Comuns -->
              <div class="mb-3">
                <label for="location" class="form-label fw-bold">Local / Sala / Prédio</label>
                <input type="text" class="form-control" id="location" placeholder="Ex: Prédio 2 - Sala 304 UFCSPA" />
              </div>

              <div class="mb-3">
                <label for="description" class="form-label fw-bold">Detalhes / Descrição</label>
                <textarea class="form-control" id="description" rows="2" placeholder="Ex: Conteúdo programático, pauta ou observações"></textarea>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label fw-bold">Telefone / Contato</label>
                <input type="tel" class="form-control" id="phone" placeholder="(51) 90000-0000" />
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar Agendamento(s)</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Visualizar Detalhes -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="detailTitle">Detalhes do Compromisso</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="detailBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SweetAlert2 & Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
